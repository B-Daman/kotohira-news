<link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png">

<script src="parking-data.js"></script>

<!-- Instagram/X の埋め込みスクリプトはここでは読み込まない。表示時にのみ動的注入する（ensureIgScript/ensureTwttrScript） -->
<style>
  :root{
    --bg:#faf8f4; --card:#ffffff; --line:#e7e1d6; --ink:#2c2622; --sub:#7a7066;
    --accent:#c8472f; --accent-d:#a3381f; --accent-soft:#fbe9e4;
    /* --note/--web/--yt/--ameblo/--media-tv/--media-gov/--media-other は
       白文字バッジのコントラスト比AA(4.5:1)を満たす調整値。他は初代のまま */
    --note:#258475; --ig:#c13584; --x:#1d1d1f; --web:#3170eb; --yt:#df3047; --ameblo:#298542;
    --media-newspaper:#3a5a80; --media-tv:#a9631e; --media-gov:#458263; --media-webmedia:#7c5cbf; --media-other:#7e756a;
    /* 🏪 お店の営業カレンダーのSNSバッジ用。既存--web/--igとは別に、Facebook公式ブルーと
       Threadsの黒系を新規トークンとして持つ（.shop-sns配下でだけ使う。他タブの配色は変えない） */
    --fb:#1877f2; --threads:#0a0a0a;
  }
  *{box-sizing:border-box}
  /* iOS Safariの文字自動拡大を無効化。放置すると<a>だけ拡大され<button>はされないため、
     ドロワー等で行ごとに文字サイズがバラバラに見える（Chromeでは再現しない実機Safari固有の挙動） */
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    line-height:1.7}
  a{color:var(--accent-d);text-decoration:none}

  /* 上部固定バー＋ホバー／フォーカスで開く2階層ナビ */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);
    backdrop-filter:saturate(180%) blur(6px);border-bottom:1px solid var(--line)}
  /* ヘッダーは全幅（参考サイト調査より）。コンテンツ本体のみ幅を絞る */
  .topbar-inner{padding:10px 20px 0}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-weight:900;font-size:22px;color:var(--accent-d)}
  .brand small{color:var(--sub);font-weight:500;font-size:13.5px;margin-left:10px}
  /* ヘッダー右側の天気チップ＋ハンバーガー。PCでは常に非表示（≤720pxの@mediaで出す） */
  .topbar-actions{display:none}
  .primary-nav{display:flex;gap:7px;padding:10px 0 6px;overflow:visible}
  .primary-nav-item{position:relative;flex:0 0 auto}
  .primary-tab{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:10px;padding:8px 15px;font-size:14px;font-weight:900;cursor:pointer;
    white-space:nowrap;transition:.12s;font-family:inherit}
  .primary-tab:hover{background:var(--accent-soft);color:var(--accent-d)}
  .primary-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .primary-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .primary-tab .nav-short{display:none}
  .nav-caret{display:inline-block;margin-left:5px;font-size:10px;transition:transform .12s}
  .primary-tab[aria-expanded="true"] .nav-caret{transform:rotate(180deg)}
  .nav-dropdown{position:absolute;top:100%;left:0;z-index:70;min-width:210px;padding:6px;
    background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(44,38,34,.14)}
  .nav-dropdown[hidden]{display:none}
  .nav-dropdown-item{display:block;width:100%;border:0;border-radius:8px;padding:9px 11px;
    background:#fff;color:var(--ink);text-align:left;white-space:nowrap;font-family:inherit;font-weight:700;font-size:13.5px;line-height:1.45;cursor:pointer}
  .nav-dropdown-item:hover,.nav-dropdown-item:focus-visible{background:var(--accent-soft);color:var(--accent-d);outline:none}
  .nav-dropdown-item.active{background:var(--accent);color:#fff}
  .nav-dropdown-item.active:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .page-shell{max-width:1320px;margin:0 auto;padding:22px 20px 40px;display:grid;
    grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "utility" "community";
    gap:18px;align-items:start}
  #main{grid-area:main;min-width:0;scroll-margin-top:110px}
  .sidebar-utility{grid-area:utility}
  .sidebar-community{grid-area:community}
  .sidebar-block:empty{display:none}
  .group-h{font-size:15px;font-weight:900;margin:22px 0 10px;color:var(--accent-d)}
  .group-h:first-of-type{margin-top:0}

  /* 検索ボックス */
  .search-box{margin-bottom:14px}
  .search-box input{width:100%;max-width:360px;padding:8px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .search-box input:focus{outline:2px solid var(--accent);outline-offset:1px}

  /* 一覧表 */
  .table-wrap{width:100%;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
  table{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#fcfaf6;color:var(--sub);font-weight:700;font-size:12.5px;white-space:nowrap}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr[data-org-id],tbody tr[data-open-detail]{outline:none}
  tbody tr[data-org-id]:focus-visible,tbody tr[data-open-detail]:focus-visible{
    outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
  td.cnt{white-space:nowrap;color:var(--sub)}
  .muted{color:var(--sub);font-size:13px}

  /* SNSリンクのバッジ */
  .links{display:flex;flex-wrap:wrap;gap:6px}
  .lk{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;
    color:#fff;text-decoration:none;white-space:nowrap}
  .lk.note{background:var(--note)} .lk.instagram{background:var(--ig)} .lk.x{background:var(--x)}
  .lk.website{background:var(--web)} .lk.youtube{background:var(--yt)} .lk.ameblo{background:var(--ameblo)}
  /* LINE・Facebook・Discord（リンクタブのSNSバッジ用）。ブランド色を白文字AAを満たす暗さに調整 */
  .lk.line{background:#148244} .lk.facebook{background:#14549c} .lk.discord{background:#4b57d9}
  .lk.off{background:none;border:1px solid var(--line);color:#736a60}

  /* 戻るリンク（ボタンだがリンク風） */
  .back-link{display:inline-block;margin-bottom:12px;background:none;border:none;padding:0;
    color:var(--accent-d);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .back-link:hover{text-decoration:underline}

  /* 団体ヘッダ */
  .acct-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .acct-head .name{font-size:1.25rem;font-weight:900;margin:0 0 4px}
  .acct-head .desc{margin:6px 0 12px;font-size:14px;color:#43403b}

  /* サブタブ 見た目 */
  .subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .subtab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 16px;
    font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);transition:.12s;font-family:inherit}
  .subtab:hover{border-color:var(--accent)}
  .subtab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* フィード（団体の更新一覧・ニュースの定例ピックアップ 共用） */
  .feed{display:flex;flex-direction:column;gap:10px}
  .feed-item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;align-items:center;text-decoration:none;color:inherit;transition:border-color .12s}
  .feed-item:hover{border-color:var(--accent)}
  .feed-item.dup{opacity:.72}
  .feed-item img{width:104px;height:68px;object-fit:cover;border-radius:8px;flex:0 0 104px;background:#eee;display:block}
  .fi-ph{width:104px;height:68px;border-radius:8px;flex:0 0 104px;font-size:20px}
  .feed-item .fi-body{flex:1;min-width:0}
  .feed-item .fi-meta{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .feed-item .fi-ttl{font-size:14.5px;font-weight:700;line-height:1.5;margin-top:3px}
  .org-name{font-weight:700;color:var(--accent-d)}

  /* 出典・媒体バッジ（団体items由来 / Notionニュース由来 共用） */
  .src{display:inline-block;border-radius:5px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .src.note{background:var(--note)} .src.instagram{background:var(--ig)} .src.x{background:var(--x)}
  .src.website{background:var(--web)} .src.youtube{background:var(--yt)} .src.ameblo{background:var(--ameblo)}
  .src.newspaper{background:var(--media-newspaper)} .src.tv{background:var(--media-tv)}
  .src.gov{background:var(--media-gov)} .src.webmedia{background:var(--media-webmedia)} .src.other{background:var(--media-other)}

  /* プレースホルダサムネ共通（.src と組み合わせて背景色をつける） */
  .ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}

  .badge-new{background:var(--accent);color:#fff;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:900}
  .badge-dup{background:#d8d0c4;color:#5c554c;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:700}
  .pickup-section{margin-bottom:26px}
  .pickup-section .feed-item{border-color:var(--accent)}

  /* 最新ニュース：通常ニュースと明確に差をつける大きめのフィーチャーカード */
  .pf-grid{display:flex;flex-direction:column;gap:14px}
  .pf-card{display:flex;gap:16px;background:var(--card);border:2px solid var(--accent);border-radius:16px;
    padding:14px;text-decoration:none;color:inherit;transition:box-shadow .12s;cursor:pointer;outline:none}
  .pf-card:hover{box-shadow:0 4px 16px rgba(200,71,47,.18)}
  .pf-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pf-img{width:180px;height:120px;object-fit:cover;border-radius:12px;flex:0 0 180px;background:#eee;font-size:34px}
  .pf-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
  .pf-meta{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pf-title{font-size:17px;font-weight:900;line-height:1.45}
  .pf-summary{font-size:13px;color:var(--sub);line-height:1.6}
  @media (max-width:480px){
    .pf-card{flex-direction:column}
    .pf-img{width:100%;flex:0 0 auto;aspect-ratio:16/9;height:auto}
  }

  /* ニュース：②リストは5行程度に固定し縦スクロール */
  .compact-list-scroll{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .compact-list-scroll .compact-row{padding:8px 10px}

  /* 行クランプ（2行） */
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* イベント・キャンペーン カード（共用・クリックで詳細モーダル） */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .ev-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .12s;
    cursor:pointer;outline:none}
  .ev-card:hover{border-color:var(--accent)}
  .ev-card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .ev-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block}
  .ev-img.ph{display:flex;font-size:30px;color:var(--sub);background:#f1ece2}
  .ev-img.fit-contain,.modal-img.fit-contain{object-fit:contain;background:#fff}
  .ev-body{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .ev-status-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:5px;padding:1px 8px;
    font-size:10.5px;font-weight:900;margin-bottom:2px;align-self:flex-start}
  .ev-status-badge.upcoming{background:var(--accent-soft);color:var(--accent-d)}
  .ev-status-badge.ended{background:#d8d0c4;color:#5c554c}
  .ev-title{font-size:14.5px;font-weight:700;line-height:1.5}
  .ev-meta{font-size:12.5px;color:var(--sub)}
  .ev-comment{font-size:12.5px;color:#43403b;margin-top:4px}
  .ended-section{margin-top:22px}
  .ended-section summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--sub);padding:8px 0}
  .ended-section[open] summary{margin-bottom:6px}

  /* 🅿 駐車場タブ：裏取り（confidence）バッジ。◎確認済み=緑／○一部確認=青／△要確認=目立つ赤。
     カード左上に置くため .ev-status-badge と同じ位置取り。既存CSSは最大限流用し追加はこれのみ */
  .conf-badge{display:inline-block;border-radius:5px;padding:1px 8px;font-size:10.5px;font-weight:900;
    align-self:flex-start;margin-bottom:2px}
  .conf-high{background:var(--media-gov);color:#fff}   /* ◎ 一次確認済み */
  .conf-medium{background:var(--web);color:#fff}       /* ○ 一部裏取り */
  .conf-low{background:var(--accent);color:#fff}       /* △ 要現地確認（目立つ赤） */

  /* 🍜 うどん：営業中バッジ（ev-status-badge と同寸）。種類バッジの横に並べる。
     open=緑系（conf-high＝var(--media-gov)と調和）／pre=accent-soft／closed-today・after=グレー系。
     .lg はモーダル用の一回り大きい版（modal-badge と並べる）。 */
  .badge-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:2px}
  .badge-row .ev-status-badge{margin-bottom:0}
  .open-badge{display:inline-block;border-radius:5px;padding:1px 8px;font-size:10.5px;font-weight:900}
  .open-badge.lg{padding:3px 10px;font-size:11.5px;border-radius:6px}
  .open-badge.open{background:var(--media-gov);color:#fff}
  .open-badge.pre{background:var(--accent-soft);color:var(--accent-d)}
  .open-badge.closed-today,.open-badge.after{background:#d8d0c4;color:#5c554c}
  .modal-badge-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .modal-badge-row .modal-badge{margin-bottom:0}

  /* 🅿 駐車場タブ：Googleマップ埋め込み（APIキー不要の検索クエリ型iframe）。
     角丸・枠はカード類に合わせる。width:100% で横スクロールを出さない */
  .map-embed{width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:var(--card);margin:2px 0 4px}
  .map-embed iframe{width:100%;height:300px;border:0;display:block}

  /* 🔗 リンクタブ：公式サイトへのリンクカード（サムネ＋SNSバッジ付き）。
     サムネは assets/links/ のローカル画像（local-first。無ければ頭文字プレースホルダ）。
     SNSバッジは独立したリンクのため、a要素の入れ子にならないよう本体リンク(.lc-main)と分離する */
  .link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:8px}
  .link-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;transition:border-color .12s,box-shadow .12s}
  .link-card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(200,71,47,.10)}
  .lc-main{display:block;text-decoration:none;color:inherit}
  .lc-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#f1ece2;display:block}
  .lc-img.ph{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--sub)}
  .lc-body{padding:12px 16px 4px}
  .lc-sns{padding:2px 16px 12px;margin-top:auto}
  .link-name{font-size:14.5px;font-weight:700;line-height:1.5;color:var(--ink)}
  .link-arrow{color:var(--accent-d);font-size:12px}
  .link-note{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.55}
  .link-url{font-size:11.5px;color:var(--web);margin-top:6px;word-break:break-all}

  /* 終了・ニュースリスト等：コンパクトな行（クリックでモーダル or 外部記事） */
  .compact-list{display:flex;flex-direction:column}
  .compact-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit;font-size:13.5px;cursor:pointer;outline:none}
  .compact-row:last-child{border-bottom:none}
  .compact-row:hover{background:var(--accent-soft)}
  .compact-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .cr-date{flex:0 0 60px;color:var(--sub);font-size:12px;white-space:nowrap}
  .cr-title{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ニュース box カード（ホーム／ニュースタブのギャラリー共通。card-grid内で使用） */
  .home-box{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .12s;
    cursor:pointer;outline:none}
  .home-box:hover{border-color:var(--accent)}
  .home-box:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .hb-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block}
  /* ニュースboxカード：サムネ欠損時は媒体の頭文字を中央表示。
     .hb-img が display:block で .ph の flex を上書きするため、ここで再指定して中央寄せを効かせる */
  .hb-img.ph{display:flex;font-size:22px}
  .hb-body{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
  .hb-meta{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .hb-title{font-size:13.5px;font-weight:700;line-height:1.45}

  /* ホーム：3セクション（ニュース＝赤／イベント＝青／キャンペーン＝緑）をテーマ色の
     縦ライン・見出し色・説明文で区別する。「全部ニュース？」と誤読されない工夫 */
  .home-sec{border-left:4px solid var(--hs);padding:2px 0 2px 16px;margin-bottom:28px}
  /* 末尾の余白調整：うどんモジュールが無い日は.hs-camps、ある日は.home-udonが実際の最後尾になる。
     :last-of-typeは<section>タグ単位の判定でクラスを見ないため、順序が変わると効かなくなる。
     :last-childなら実際の兄弟順で判定できるので、どちらが最後でも正しくmargin-bottomが消える */
  .home-sec:last-child{margin-bottom:0}
  .hs-news{--hs:var(--accent)}
  .hs-events{--hs:#3170eb}
  .hs-camps{--hs:#1d8a4e}
  .home-sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px}
  .home-sec-head .group-h{margin:0;color:var(--hs)}
  .hs-sub{flex:1;font-size:12px;color:var(--sub);white-space:nowrap}
  .more-link{background:none;border:none;color:var(--accent-d);font-size:12.5px;font-weight:700;
    cursor:pointer;font-family:inherit;white-space:nowrap}
  .more-link:hover{text-decoration:underline}

  /* ホーム：いま営業中のうどん店モジュール。主要3セクションより控えめな枠付きカードにする（琥珀の左ライン） */
  .home-udon{border:1px solid var(--line);border-left:4px solid #d8a24a;border-radius:12px;
    background:#fdfbf7;padding:13px 16px;margin-bottom:28px}
  .home-udon:last-child{margin-bottom:0}
  .home-udon-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .home-udon-head .group-h{margin:0;color:#8a5a1d}
  .home-udon-time{font-size:11.5px;color:var(--sub);font-weight:700;white-space:nowrap}
  .home-udon-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:var(--card)}
  .home-udon-row{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;
    border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;
    cursor:pointer;padding:9px 12px}
  .home-udon-row:last-child{border-bottom:0}
  .home-udon-row:hover{background:var(--accent-soft)}
  .home-udon-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .hur-name{font-size:13.5px;font-weight:900;line-height:1.4}
  .hur-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
  .home-udon-empty{font-size:12.5px;color:var(--sub);padding:6px 2px}
  .home-udon-pre{font-size:12px;color:#4d4740;margin-top:8px}
  .home-udon-foot{margin-top:10px}
  .home-udon-more{width:100%}

  /* 画面を押し下げすぎない、ページ名と更新状況だけの小さなカード */
  .page-title-card{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:12px;padding:9px 14px;margin:0 0 14px}
  .page-title-card h1{font-size:17px;line-height:1.4;font-weight:900;margin:0}
  .page-title-meta{color:var(--sub);font-size:11px;font-weight:700;white-space:nowrap}

  /* サイドバーウィジェット（モバイルは本文を先にし、その後へまとめる） */
  .widget-stack{display:flex;flex-direction:column;gap:14px}
  .widget-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-width:0}
  .widget-card.weather-card{border-top:4px solid #3170eb}
  .widget-card.line-card{border-top:4px solid #148244}
  .widget-card.dam-card{border-top:4px solid #1d75b3}
  .widget-card.ad-card{padding:10px}
  .widget-kicker{display:block;color:var(--sub);font-size:10.5px;font-weight:900;letter-spacing:.06em;margin-bottom:2px}
  .widget-title{font-size:15px;font-weight:900;line-height:1.45;margin:0 0 8px}
  .widget-copy{font-size:12.5px;color:#4d4740;line-height:1.65;margin:0 0 10px}
  .widget-note{font-size:10.5px;color:var(--sub);line-height:1.55;margin:8px 0 0}
  .widget-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .widget-link{font-size:11.5px;font-weight:700;color:var(--accent-d);text-decoration:none}
  .widget-link:hover{text-decoration:underline}
  .widget-loading{font-size:12.5px;color:var(--sub);padding:8px 0}
  /* 💧 早明浦ダム貯水状況：貯水率を大きく、貯水量・流入量・放流量は控えめな一覧行にする */
  .dam-rate{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .dam-rate-num{font-size:30px;font-weight:900;line-height:1;color:#1d75b3}
  .dam-rate-pct{font-size:16px;font-weight:900;margin-left:1px}
  .dam-rate-label{font-size:11px;color:var(--sub);font-weight:700}
  .dam-rows{display:flex;flex-direction:column;gap:4px}
  .dam-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#4d4740}
  .dam-row span:first-child{color:var(--sub)}
  .weather-days{display:flex;flex-direction:column;gap:8px}
  .weather-day{display:grid;grid-template-columns:42px minmax(0,1fr);gap:9px;align-items:center;
    border-top:1px solid var(--line);padding-top:8px}
  .weather-day:first-child{border-top:none;padding-top:0}
  .weather-icon{font-size:28px;line-height:1;text-align:center}
  .weather-label{font-size:11px;color:var(--sub);font-weight:700}
  .weather-text{font-size:13.5px;font-weight:900;line-height:1.4;margin-top:1px}
  .weather-meta{display:flex;gap:8px;flex-wrap:wrap;color:#4d4740;font-size:11.5px;margin-top:3px}
  .weather-fallback{font-size:12.5px;color:var(--sub);line-height:1.65}
  /* .quick-route: 「目的から探す」カード（2026-09-05削除）の名残だが、home-udon-moreボタンが
     同じクラスを流用しているため維持する。.quick-grid（4ボタンの2x2グリッド）はカード削除に
     伴い他に使用箇所が無いため削除済み。 */
  .quick-route{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 7px;
    color:var(--ink);font-family:inherit;font-weight:700;font-size:11.5px;line-height:1.35;text-align:left;cursor:pointer}
  .quick-route:hover{background:var(--accent-soft);color:var(--accent-d);border-color:var(--accent)}
  .quick-route:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .line-content{display:flex;flex-direction:column;gap:10px}
  .line-content>*{margin:0}
  .line-qr{width:120px;height:120px;object-fit:contain;border:1px solid var(--line);border-radius:8px;
    background:#fff;align-self:center}
  .line-join{display:inline-block;background:#148244;color:#fff;border-radius:8px;padding:8px 13px;
    font-size:12.5px;font-weight:900;text-align:center}
  .line-join:hover{background:#0f6e38;color:#fff}
  .widget-card.featured-event-card{border-top:4px solid var(--accent)}
  .featured-event-card .widget-kicker{color:var(--accent-d)}
  .featured-event-main{display:block;color:inherit;text-decoration:none;border-radius:8px}
  a.featured-event-main:hover .widget-title{color:var(--accent-d)}
  .featured-event-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .featured-event-image{width:100%;display:block;border-radius:8px;background:#f1ece2;margin:2px 0 9px}
  .featured-event-meta{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#4d4740;line-height:1.55}
  .featured-event-cta{margin-top:9px;font-size:12.5px;font-weight:900;color:var(--accent-d)}
  .ad-label{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--sub);
    font-size:10px;font-weight:900;margin:0 2px 7px}
  .ad-main{display:block;color:inherit;text-decoration:none;border-radius:8px;overflow:hidden}
  .ad-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ad-image{width:100%;aspect-ratio:3/1;display:block;object-fit:cover;background:#f1ece2}
  .ad-title{font-size:12px;font-weight:700;line-height:1.5;padding:8px 3px 2px}
  .ad-vacancy{border-style:dashed;text-align:center;background:#fcfaf6}
  .ad-vacancy .widget-copy{margin-bottom:0}
  .ad-mobile-only{display:none}
  .mobile-ad-slot{display:none;margin:0 0 18px}
  .data-widget{background:transparent;border-style:dashed}
  .data-widget .widget-note{margin:0}

  /* 最小限のフッター。リンクは正式URLが設定されたものだけ表示する */
  .site-footer{border-top:1px solid var(--line);background:#fff}
  .footer-inner{max-width:1320px;margin:0 auto;padding:15px 20px;display:flex;align-items:center;
    justify-content:space-between;gap:16px;flex-wrap:wrap}
  .footer-brand{font-size:14px;font-weight:900;color:var(--accent-d)}
  .footer-links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .footer-links[hidden],.footer-links:empty{display:none}
  .footer-link{font-size:11.5px;color:var(--sub);font-weight:700}
  .footer-link:hover{text-decoration:underline;color:var(--accent-d)}


  /* キャンペーンタブ：Googleカレンダー風の月グリッド */
  .cal-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:22px}
  .cal-header{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
  .cal-nav-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;
    font-size:14px;cursor:pointer;color:var(--ink)}
  .cal-nav-btn:hover{background:var(--accent-soft);color:var(--accent-d)}
  .cal-month-label{font-size:16px;font-weight:900;min-width:110px;text-align:center}
  .cal-weekday-row{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);
    border-top:1px solid var(--line)}
  .cal-weekday{font-size:11px;color:var(--sub);text-align:center;font-weight:700;padding:4px 0;
    background:#fcfaf6;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cal-weekday.sat{color:#2b63cf}
  .cal-weekday.sun{color:var(--accent-d)}
  .cal-week{position:relative}
  .cal-cells{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line)}
  /* min-width:0 は必須。Gridの既定 min-width:auto のままだと、下の nowrap な
     チップ/バーの長文が列の最小幅を押し広げ、隣セルへはみ出して崩れる（ellipsisも効かない）。 */
  .cal-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    min-height:var(--cell-h,88px);padding:4px 6px;background:var(--card);min-width:0}
  .cal-cell.other-month{background:#faf9f6}
  .cal-cell.sat{background:#f3f7fd}
  .cal-cell.sun{background:#fdf4f1}
  .cal-cell.sat .cal-cell-num{color:#2b63cf}
  .cal-cell.sun .cal-cell-num{color:var(--accent-d)}
  .cal-cell.other-month.sat,.cal-cell.other-month.sun{background:#faf9f6}
  .cal-cell.today{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .cal-cell-num{font-size:12px;color:var(--sub);font-weight:700;display:inline-block}
  .cal-cell.other-month .cal-cell-num{color:#cfc7b9}
  .cal-cell.today .cal-cell-num{background:var(--accent);color:#fff;border-radius:50%;
    width:20px;height:20px;line-height:20px;text-align:center}
  /* 日付番号と祝日名を同一行に並べる（右端に祝日名）。セル高さは日付番号のみの時と変わらない。 */
  .cal-cell-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-width:0}
  .cal-holiday-name{font-size:9.5px;font-weight:700;color:var(--accent-d);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cal-cell.other-month .cal-holiday-name{color:#d3b0a6}
  .cal-bars-overlay{position:absolute;top:24px;left:0;right:0;bottom:2px;display:grid;
    grid-template-columns:repeat(7,1fr);gap:2px;pointer-events:none;overflow:hidden}
  .cal-bar{pointer-events:auto;grid-row:1;border-radius:4px;padding:2px 6px;font-size:10.5px;color:#fff;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:18px;line-height:14px;cursor:pointer;outline:none;min-width:0}
  .cal-bar.active{background:var(--accent)}
  .cal-bar.upcoming{background:var(--accent-soft);color:var(--accent-d)}
  .cal-bar.cont-left{border-top-left-radius:0;border-bottom-left-radius:0}
  .cal-bar.cont-right{border-top-right-radius:0;border-bottom-right-radius:0}
  .cal-bar:hover{filter:brightness(.95)}
  .cal-bar:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

  /* イベントカレンダー：単日イベントは開始日セル内のチップで表示（複数日のみバー） */
  .cal-chips{display:flex;flex-direction:column;gap:2px;min-width:0}
  .cal-chip{background:var(--accent-soft);color:var(--accent-d);border-radius:3px;padding:1px 5px;
    font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;outline:none;min-width:0}
  .cal-chip:hover{filter:brightness(.96)}
  .cal-chip:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .cal-chip-more{background:none;color:var(--sub)}
  /* 週表示（PC）：月グリッドの1週間拡大版。セルを大きくし（min-height 260px。内容に応じて伸びる）、
     チップは折り返しを許可し「HH:MM イベント名」を最大3行まで表示、時刻部分を強調する。 */
  .cal-cells.week-grid .cal-cell{min-height:260px}
  .cal-cells.week-grid .cal-chips{gap:4px}
  .cal-chip-week{white-space:normal;text-overflow:clip;font-size:11.5px;line-height:1.35;
    padding:3px 6px;border-radius:5px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
  .cal-chip-time{font-weight:900;color:var(--accent-d)}

  /* イベントカレンダーのスマホ表示。PCは月間グリッド／週グリッド、スマホは一覧に切り替える。 */
  .event-mobile-agenda{display:none}
  .event-week-mobile{display:none}
  .event-agenda-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:2px 0 9px;font-size:12px;color:var(--sub);font-weight:700}
  .event-agenda-list{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .event-agenda-item{width:100%;display:grid;grid-template-columns:94px minmax(0,1fr) 14px;gap:10px;
    align-items:center;min-height:64px;padding:10px 11px;border:0;border-bottom:1px solid var(--line);
    background:var(--card);color:var(--ink);text-align:left;font-family:inherit;cursor:pointer}
  .event-agenda-item:last-child{border-bottom:0}
  .event-agenda-item:hover{background:var(--accent-soft)}
  .event-agenda-item:focus-visible{position:relative;z-index:1;outline:2px solid var(--accent);outline-offset:-2px}
  .event-agenda-date{display:flex;flex-direction:column;line-height:1.35;color:var(--accent-d)}
  .event-agenda-date strong{font-size:13px;font-weight:900}
  .event-agenda-date small{font-size:11px;color:var(--sub);font-weight:700}
  .event-agenda-body{min-width:0;display:flex;flex-direction:column;gap:3px}
  .event-agenda-title{font-size:13.5px;line-height:1.5;font-weight:900;overflow-wrap:anywhere}
  .event-agenda-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
  .event-agenda-status{display:inline-block;border-radius:999px;padding:1px 6px;font-size:10.5px;font-weight:800;
    background:var(--accent-soft);color:var(--accent-d)}
  .event-agenda-status.active{background:var(--accent);color:#fff}
  .event-agenda-status.ended{background:#e8e3dc;color:#625a51}
  .event-agenda-arrow{color:var(--sub);font-size:18px;line-height:1;text-align:right}

  /* イベントカレンダーの月／週切替トグル（イベントカレンダーのみ。cal-nav-btnと調和する小さめのボタン） */
  .cal-view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .cal-view-btn{border:0;background:#fff;color:var(--sub);font-family:inherit;font-weight:800;font-size:12px;line-height:1;font-family:inherit;
    padding:8px 12px;cursor:pointer}
  .cal-view-btn+.cal-view-btn{border-left:1px solid var(--line)}
  .cal-view-btn:hover{background:var(--accent-soft);color:var(--accent-d)}
  .cal-view-btn.active{background:var(--accent);color:#fff}
  .cal-view-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .cal-week-label{min-width:200px}
  /* 週表示：Googleカレンダーの「スケジュール」ビュー風。全体を1枚のカードにし、日付列とイベント列の
     2列グリッド行を1pxの区切り線だけで縦に並べる（PC・スマホ共通。月表示の出し分けとは別クラス）。 */
  .event-week-view{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .ewk-row{display:grid;grid-template-columns:86px minmax(0,1fr);border-top:1px solid var(--line)}
  .ewk-row:first-child{border-top:0}
  /* 今日の行は月カレンダーの .cal-cell.today と同系に強調（accent-soft＋左端のアクセントバー） */
  .ewk-row.today{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .ewk-datecol{display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:1.2;
    padding:10px 8px 10px 12px;border-right:1px solid var(--line)}
  .ewk-date{font-size:16px;font-weight:900;color:var(--ink)}
  .ewk-sub{font-size:10.5px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ewk-row.sat .ewk-date,.ewk-row.sat .ewk-sub{color:#2b63cf}
  .ewk-row.sun .ewk-date,.ewk-row.sun .ewk-sub{color:var(--accent-d)}
  .ewk-events{min-width:0;display:flex;flex-direction:column;justify-content:center}
  /* イベント行内はカード背景を透過させ、行の強調（today）や区切り線が正しく見えるようにする */
  .ewk-events .event-agenda-item{background:transparent}
  /* 予定のない日は低い行高で薄く（見出しは7日分すべて残す） */
  .ewk-empty{padding:7px 12px;font-size:11.5px;color:var(--sub)}
  /* 週表示の行は日付見出しが別にあるため、日付列を省いた本文＋矢印の2列にする */
  .event-agenda-item.agenda-week{grid-template-columns:minmax(0,1fr) 14px}

  /* 詳細モーダル（イベント／キャンペーン共用） */
  .modal-overlay{position:fixed;inset:0;background:rgba(30,25,20,.55);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex}
  .modal-box{background:var(--card);border-radius:16px;max-width:480px;width:100%;max-height:85vh;
    overflow-y:auto;padding:24px 22px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.28)}
  .modal-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:none;background:var(--bg);
    border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:var(--sub);outline:none}
  .modal-close:hover{background:var(--accent-soft);color:var(--accent-d)}
  .modal-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .modal-title{font-size:17px;font-weight:900;margin:0 0 8px;padding-right:30px}
  .modal-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:12px;background:#eee;display:block}
  .modal-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:10px}
  .modal-badge{display:inline-block;border-radius:6px;padding:3px 10px;font-size:11.5px;font-weight:700;margin-bottom:10px}
  .modal-badge.status-active{background:var(--accent);color:#fff}
  .modal-badge.status-upcoming{background:var(--accent-soft);color:var(--accent-d)}
  .modal-badge.status-ended{background:#d8d0c4;color:#5c554c}
  .modal-row{display:flex;gap:8px;font-size:13.5px;color:var(--ink);margin-bottom:8px;line-height:1.6}
  .modal-row .mr-label{flex:0 0 80px;color:var(--sub);font-weight:700;white-space:nowrap}
  .modal-comment{font-size:13.5px;color:#43403b;margin:12px 0;line-height:1.75;white-space:pre-wrap}

  /* モバイルヘッダー：天気チップ・ハンバーガー・右スライドドロワー（すべて≤720px専用。

  .shop-warn-notice{background:var(--accent);color:#fff;border-radius:10px;padding:12px 16px;

  .shop-row{width:100%;display:flex;align-items:center;gap:10px;padding:13px 15px;
    border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);
    text-align:left;font-family:inherit;cursor:pointer}
  .shop-row:last-child{border-bottom:0}
  .shop-row:hover{background:var(--accent-soft)}
  .shop-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .shop-row-name{flex:1;min-width:0;font-size:14px;font-weight:900;overflow:hidden;

  .shop-row-month{font-size:11.5px;color:var(--sub);font-weight:700;white-space:nowrap}
  .shop-row-arrow{color:var(--sub);font-size:16px}

  /* 390px幅だと店名(可変)+ジャンルバッジ+月表記+矢印の1行では窮屈で右端がはみ出すため、
     狭い画面だけ折り返しを許可する（店名は全幅、残りは2行目へ。tmp-shopcal-a/bの試作撮影で
     headless Chromeの390px未満クランプに引っかかって気づいた実害） */
  @media (max-width:480px){
    .shop-row{flex-wrap:wrap;row-gap:5px}

  /* Facebook・Threadsは新規トークン。既存.lk.facebook（リンク/団体タブ）とは.shop-sns配下でのみ

  .shop-sns .lk.facebook{background:var(--fb)}
  .shop-sns .lk.threads{background:var(--threads)}

  /* ℹ️ サイト情報3ページ（運営者情報・お問い合わせ・プライバシーポリシー）。既存の.group-h/.hint

    .cal-header{flex-wrap:wrap;gap:8px}

    /* イベントカレンダーはモバイルでもPCと同じ月/週グリッドを使う（アジェンダ一覧は廃止。

       display:noneがそのまま効いて常時非表示になる。この@media内で表示に戻す指定はしない）。
       狭い画面では収まらないので.event-calendar-desktopごと横スクロールにし、

    /* ハンバーガーボタン：primary-navの代わりにドロワーを開く */

    .hamburger-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    /* 天気チップ：取得できた時だけ renderWeatherChip() が .ready を付けて表示する */
    .weather-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;
      align-items:center;gap:4px;font-family:inherit;font-weight:700;font-size:12.5px;line-height:1;color:var(--ink);cursor:pointer;white-space:nowrap}
    .weather-chip.ready{display:inline-flex}
    .weather-chip:hover,.weather-chip.open{background:var(--accent-soft);color:var(--accent-d);border-color:var(--accent)}
    .weather-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    /* 天気チップの展開パネル：ヘッダー直下に既存weatherForecastHTML相当の内容を表示 */
    .weather-chip-panel.show{display:block;border-top:1px solid var(--line);
      padding:14px 12px 16px;background:var(--card)}

    /* 💧 早明浦ダムチップ：天気チップと完全に同じ見た目・流儀（サイズ・配色・開閉トークンを共用）。
       390px幅で天気チップ・ハンバーガーと3つ並んでも収まるよう詰め表記「💧8.3%」にする */
    .dam-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;
      align-items:center;gap:4px;font-family:inherit;font-weight:700;font-size:12.5px;line-height:1;color:var(--ink);cursor:pointer;white-space:nowrap}
    .dam-chip.ready{display:inline-flex}
    .dam-chip:hover,.dam-chip.open{background:var(--accent-soft);color:var(--accent-d);border-color:var(--accent)}
    .dam-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .dam-chip-panel.show{display:block;border-top:1px solid var(--line);
      padding:14px 12px 16px;background:var(--card)}

    /* ハンバーガードロワー（右寄せ。既存.modal-overlayと同じdisplay切替方式） */
    .drawer-overlay.show{display:flex;position:fixed;inset:0;z-index:90;
      background:rgba(30,25,20,.5);justify-content:flex-end}
    .drawer-build{flex:0 0 auto;padding:6px 16px 12px;font-size:11px;color:var(--sub);text-align:right}
    .drawer-panel{width:82%;max-width:320px;height:100%;background:var(--card);
      -webkit-text-size-adjust:100%;text-size-adjust:100%;
      display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.22)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;border-bottom:1px solid var(--line)}
    .drawer-title{font-size:17px;font-weight:900;color:var(--accent-d)}
    .drawer-close{border:none;background:var(--bg);width:32px;height:32px;border-radius:50%;
      font-size:18px;line-height:1;cursor:pointer;color:var(--sub)}
    .drawer-close:hover{background:var(--accent-soft);color:var(--accent-d)}
    .drawer-nav{flex:1;overflow-y:auto;padding:8px 8px 24px}
    /* ドロワーのアコーディオン：大分類（ホーム/町の今/訪れる・関わる/町を知る/サイト情報）は
       常に見えていて、タップで配下（.drawer-sub）が開閉する。.drawer-subの表示切替はhidden属性で行い、
       ここではdisplayを一切上書きしない（[hidden]の既定挙動をそのまま使う） */
    .drawer-group{margin:2px 0}
    /* T-A: 全行（ホーム／大分類トグル／配下リンク／サイト情報リンク）でfont-size・line-height・
       min-heightを完全に統一する（16px/1.4/48px）。太さだけは大分類900・リンク700のまま残し、
       階層の違いは書体の強さで示す。左位置はdrawer-nav(8px)+自身のpadding(10px)=18pxで
       ホーム・大分類トグル・サイト情報見出しが揃い、drawer-nav(8px)+drawer-sub(14px)+
       drawer-link(10px)=32pxで配下リンクが全グループ共通の第二階層インデントになる */
    .drawer-group-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
      min-height:52px;border:0;background:none;color:var(--ink);font-family:inherit;font-weight:900;font-size:18px;line-height:1.4;
      padding:10px 10px;border-radius:8px;cursor:pointer;text-align:left}
    .drawer-group-toggle:hover{background:var(--accent-soft);color:var(--accent-d)}
    .drawer-group-toggle.active{color:var(--accent-d)}
    .drawer-group-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
    .drawer-group-label{flex:1;min-width:0}
    .drawer-caret{flex:0 0 auto;font-size:14px;color:var(--sub);margin-left:8px}
    .drawer-sub{padding:0 4px 6px 14px;display:flex;flex-direction:column}
    .drawer-sub[hidden]{display:none}
    .drawer-link{display:flex;align-items:center;min-height:52px;width:100%;text-align:left;
      border:0;background:none;color:var(--ink);font-family:inherit;font-weight:700;font-size:18px;line-height:1.4;padding:6px 10px;
      border-radius:8px;cursor:pointer;text-decoration:none}
    .drawer-link:hover{background:var(--accent-soft);color:var(--accent-d)}
    .drawer-link.active{background:var(--ink);color:#fff}
    .drawer-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

    /* 「目的から探す」はハンバーガードロワーに統合したため、サイドバー（天気・クイックナビ）を
       まるごと畳んで空のasideの余白を出さない。PC(>720px)のサイドバー表示はそのまま */
    #utilityWidgets{display:none}

    /* 大型イベント・LINEオープンチャット・広告枠はホームだけの寄り道情報として、
       他タブ（イベント一覧など、その場で用が済むページ）では出さない。PCは全タブで表示のまま */
    body:not([data-view="home"]) #communityWidgets{display:none}

    /* ホームタブはタブ切替のアクティブ表示と重複するため、ページ名カードを消す
       （他タブでは残す。ホームのみ view=home の時だけ main が再生成されるため body[data-view]で判定） */
    body[data-view="home"] .page-title-card{display:none}

    /* セクション見出しの「もっと見る →」を折り返させず見出し行の右端に固定。
       幅が足りないのでサブテキスト(.hs-sub)はモバイルでは非表示にする */
    .home-sec-head{flex-wrap:nowrap}
    .home-sec-head .hs-sub{display:none}

    /* ホーム：最新ニュース／直近のイベント／実施中のキャンペーン共通の横スクロールカルーセル。
       カード自体（.home-box/.ev-card）の見た目は変えず、.carousel配下でだけ横並びにする */
    .carousel{position:relative}
    .carousel .card-grid{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:12px;
      scroll-snap-type:x proximity;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
    .carousel .card-grid::-webkit-scrollbar{height:6px}
    .carousel .card-grid::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
    .carousel .card-grid > *{flex:0 0 72vw;max-width:280px;scroll-snap-align:start}
    .carousel-arrow{display:flex;position:absolute;top:50%;transform:translateY(-50%);
      width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
      background:rgba(255,255,255,.85);align-items:center;justify-content:center;
      font-size:13px;color:var(--ink);cursor:pointer;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.14)}
    .carousel-arrow.prev{left:2px}
    .carousel-arrow.next{right:2px}
    .carousel-arrow:hover{background:#fff}
    .carousel-arrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .carousel.at-start .carousel-arrow.prev{opacity:.35;pointer-events:none}
    .carousel.at-end .carousel-arrow.next{opacity:.35;pointer-events:none}
  }
  /* PC(721px〜)ではホーム最新ニュースを従来通り3件だけ見せる（データ自体は6件描画している） */
  @media (min-width:721px){
    .hs-news .card-grid > .home-box:nth-child(n+4){display:none}

  @media (max-width:1099px){

    .cal-bar{font-size:9.5px}
    table{min-width:520px}
    .modal-box{padding:20px 16px}
  }
</style>

<script>
/* ===== データ取り込み（欠損に強い形へ正規化） ===== */
const D = (window.DASHBOARD_DATA && window.DASHBOARD_DATA.orgs)
  ? window.DASHBOARD_DATA
  : { orgs:[] };

/* イベント／キャンペーン共通：開始日時の昇順コンパレータ。fetch_notion.pyのNotion取得は
   「開催日時（開始）」降順のため、ND構築時にここで一度だけ並べ替え、以後の全表示経路
   （ホーム・各タブ・月/週グリッド・スマホ一覧・+N件モーダル等）に取得順ではなく正しい
   開始時刻順を効かせる（バグ修正: 2026-09-05）。
   start は "YYYY-MM-DD" または "YYYY-MM-DDTHH:MM" でISO順=文字列順に昇順比較できる。
   同日で時刻なし（終日扱い）の文字列は同日の時刻ありの文字列の前方一致プレフィックスに
   なるため、文字列比較の自然な挙動として時刻ありより先に来る（意図した挙動）。
   同値時はタイトルで安定化する。 */
function byStartAsc(a, b){
  const sa = a.start || "", sb = b.start || "";
  if(sa !== sb) return sa < sb ? -1 : 1;

    const panel = document.getElementById("weatherChipPanel");
    if(panel && panel.classList.contains("show")
      && !e.target.closest("#weatherChipPanel") && !e.target.closest("#weatherChip")){
      closeWeatherChipPanel();
    }
    const damPanel = document.getElementById("damChipPanel");
    if(damPanel && damPanel.classList.contains("show")
      && !e.target.closest("#damChipPanel") && !e.target.closest("#damChip")){
      closeDamChipPanel();
    }
  });
  document.addEventListener("keydown", function(e){
    const modalOverlay = document.getElementById("modalOverlay");
    if(modalOverlay && modalOverlay.classList.contains("show")){
      if(e.key === "Escape"){ e.preventDefault(); closeDetailModal(); return; }
      if(e.key !== "Tab") return;
      const focusable = Array.from(document.getElementById("modalBox").querySelectorAll(
        'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
      )).filter(el=>!el.hasAttribute("hidden") && el.getAttribute("aria-hidden") !== "true");
      if(!focusable.length){ e.preventDefault(); return; }
      const first = focusable[0], last = focusable[focusable.length-1];
      if(e.shiftKey && (document.activeElement === first || !modalOverlay.contains(document.activeElement))){
        e.preventDefault(); last.focus();
      } else if(!e.shiftKey && (document.activeElement === last || !modalOverlay.contains(document.activeElement))){
        e.preventDefault(); first.focus();
      }
      return;
    }
    const drawerOverlay = document.getElementById("drawerOverlay");
    if(drawerOverlay && drawerOverlay.classList.contains("show")){
      if(e.key === "Escape"){ e.preventDefault(); closeDrawer(); return; }
      if(e.key !== "Tab") return;
      const focusable = Array.from(document.getElementById("drawerPanel").querySelectorAll(
        'a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"])'
      ));
      if(!focusable.length){ e.preventDefault(); return; }
      const first = focusable[0], last = focusable[focusable.length-1];
      if(e.shiftKey && (document.activeElement === first || !drawerOverlay.contains(document.activeElement))){
        e.preventDefault(); last.focus();
      } else if(!e.shiftKey && (document.activeElement === last || !drawerOverlay.contains(document.activeElement))){
        e.preventDefault(); first.focus();
      }
      return;
    }
    if(e.key === "Escape"){
      const panel = document.getElementById("weatherChipPanel");
      if(panel && panel.classList.contains("show")) closeWeatherChipPanel();
      const damPanel = document.getElementById("damChipPanel");
      if(damPanel && damPanel.classList.contains("show")) closeDamChipPanel();
    }
  });
  window.addEventListener("hashchange", render);
  if(!location.hash){ history.replaceState(null, "", "#home"); }
  renderUtilityWidgets();
  renderCommunityWidgets();
  renderFooterLinks();
  loadWeatherWidget();
  renderDamChip();
  render();
}

/* ===== ルーティング ===== */
function parseHash(){
  const h = (location.hash||"").replace(/^#/, "");
  if(h.indexOf("org=") === 0){
    try{ return {view:"org", id: decodeURIComponent(h.slice(4))}; }
    catch(e){ return {view:"orgs"}; }
  }
  if(["home","orgs","news","events","campaigns","experiences","udon","sweets","parking","towncal","shopcal","links","operator","contact","privacy"].indexOf(h) >= 0) return {view:h};
  return {view:"home"};
}

function render(opt){
  const r = parseHash();
  closeDrawer();
  closeWeatherChipPanel();
  closeDamChipPanel();
  renderTabs(r);
  const m = document.getElementById("main");
  document.body.dataset.view = r.view;
  if(r.view === "orgs"){
    m.innerHTML = orgsListHTML(orgSearchTerm);
  } else if(r.view === "org"){
    const o = D.orgs.find(x=>x.id===r.id);
    if(!o){ location.hash = "#orgs"; return; }
    if(currentOrgId !== o.id){ orgSub = "updates"; currentOrgId = o.id; }
    m.innerHTML = orgDetailHTML(o);
    loadEmbedsForOrgSub(orgSub);
  } else if(r.view === "news"){
    m.innerHTML = newsTabHTML();
  } else if(r.view === "events"){
    m.innerHTML = eventsTabHTML();
  } else if(r.view === "campaigns"){
    m.innerHTML = campaignsTabHTML();
  } else if(r.view === "experiences"){
    m.innerHTML = experiencesTabHTML();
  } else if(r.view === "udon"){
    m.innerHTML = udonTabHTML();
  } else if(r.view === "sweets"){
    m.innerHTML = coolSweetsTabHTML();
  } else if(r.view === "parking"){
    m.innerHTML = parkingTabHTML();
  } else if(r.view === "towncal"){
    m.innerHTML = towncalTabHTML();
  } else if(r.view === "shopcal"){
    m.innerHTML = shopcalTabHTML();
  } else if(r.view === "links"){
    m.innerHTML = linksTabHTML();
  } else if(r.view === "operator"){
    m.innerHTML = operatorTabHTML();
  } else if(r.view === "contact"){
    m.innerHTML = contactTabHTML();
  } else if(r.view === "privacy"){
    m.innerHTML = privacyTabHTML();
  } else {
    m.innerHTML = homeHTML();
  }
  if(r.view !== "org") m.innerHTML = pageTitleCardHTML(r.view) + m.innerHTML;
  insertMobileInlineAds(m, r.view);
  bindCarouselArrows();
  scrollEventWeekToToday();
  const meta = PAGE_META[r.view];
  const orgTitle = r.view === "org" ? (D.orgs.find(x=>x.id===r.id)?.name || "") : "";
  document.title = orgTitle ? `${orgTitle}｜ことひらいふ`
    : r.view === "home" ? "ことひらいふ"
    : meta ? `${stripLeadingEmoji(meta.title)}｜ことひらいふ` : "ことひらいふ";
  if(hasRenderedOnce && !(opt && opt.noScroll)){
    const focusTarget = m.querySelector("h1") || m;
    focusTarget.setAttribute("tabindex", "-1");
    try{ focusTarget.focus({preventScroll:true}); }catch(e){ focusTarget.focus(); }
    if(r.view === "home"){
      window.scrollTo({top:0, behavior:"smooth"});
    }else if(typeof m.scrollIntoView === "function"){
      m.scrollIntoView({block:"start", behavior:"smooth"});
    }
  }else if(!(opt && opt.noScroll)){
    window.scrollTo({top:0, behavior:"smooth"});
  }
  hasRenderedOnce = true;
}

   「サイト情報3リンクのURLをWIDGETS.footerLinksから解決する」というindex.html固有の部分だけ受け持つ。 */
function renderDrawerNav(activeKey){
  const host = document.getElementById("drawerNav");
  if(!host || !window.SiteNav) return;
  // 運営者情報等のサイト情報3ページはNAV_GROUPSに属さない（意図的に上部タブグループへ入れて
  // いない）ため、それらを見ている時は「siteinfo」グループをアクティブとして開く。
  const isSiteInfo = (window.SITE_NAV.siteLinks || []).some(l => l.key === activeKey);
  const activeGroup = isSiteInfo ? {key:"siteinfo"} : NAV_GROUPS.find(g=>g.routes.indexOf(activeKey) >= 0);
  host.innerHTML = window.SiteNav.accordionHTML({
    activeGroupKey: activeGroup ? activeGroup.key : null,
    activeItemKey: activeKey,
    buildLeafHtml: (it, active) => `<button type="button" class="drawer-link ${active?'active':''}"
      data-route="${esc(it.key)}"${active?' aria-current="page"':''}>${esc(it.label)}</button>`
  });
}

/* ===== イベント委譲 ===== */
function onTabsClick(e){
  const groupBtn = e.target.closest("[data-nav-group]");
  if(groupBtn){
    const key = groupBtn.dataset.navGroup;
    if(openNavGroup === key && pinnedNavGroup === key){
      closeNavMenus();
    }else{
      pinnedNavGroup = key;
      setNavOpen(key, true);
    }
    return;
  }
  const b = e.target.closest("[data-route]");
  if(b){
    closeNavMenus();
    location.hash = "#" + b.dataset.route;
  }
}
function setNavOpen(key, shouldOpen){
  const primary = document.getElementById("primaryNav");
  primary.querySelectorAll("[data-nav-item]").forEach(item=>{
    const trigger = item.querySelector("[data-nav-group]");
    const panel = item.querySelector(".nav-dropdown");
    if(!trigger || !panel) return;
    const open = !!shouldOpen && item.dataset.navItem === key;
    panel.hidden = !open;
    trigger.setAttribute("aria-expanded", String(open));
  });
  openNavGroup = shouldOpen ? key : null;
}
function closeNavMenus(){
  pinnedNavGroup = null;
  setNavOpen(null, false);
}
function navItemFromEvent(e){
  const item = e.target.closest("[data-nav-item]");
  const primary = document.getElementById("primaryNav");
  return item && primary.contains(item) ? item : null;
}
function onNavPointerOver(e){
  if(e.pointerType !== "mouse" && e.pointerType !== "pen") return;
  const item = navItemFromEvent(e);
  if(!item || (e.relatedTarget && item.contains(e.relatedTarget))) return;
  if(pinnedNavGroup && pinnedNavGroup !== item.dataset.navItem) pinnedNavGroup = null;
  setNavOpen(item.dataset.navItem, true);
}
function onNavPointerOut(e){
  if(e.pointerType !== "mouse" && e.pointerType !== "pen") return;
  const item = navItemFromEvent(e);
  if(!item || (e.relatedTarget && item.contains(e.relatedTarget))) return;
  if(pinnedNavGroup !== item.dataset.navItem) setNavOpen(null, false);
}
function onNavFocusIn(e){
  if(suppressNavFocusOpen) return;
  const item = navItemFromEvent(e);
  if(item) setNavOpen(item.dataset.navItem, true);
}
function onNavFocusOut(e){
  const item = navItemFromEvent(e);
  if(!item) return;
  setTimeout(()=>{
    const stillFocused = item.contains(document.activeElement);
    const stillHovered = typeof item.matches === "function" && item.matches(":hover");
    if(!stillFocused && !stillHovered && openNavGroup === item.dataset.navItem) closeNavMenus();
  }, 0);
}
function onNavKeydown(e){
  const trigger = e.target.closest("[data-nav-group]");
  const item = navItemFromEvent(e);
  if(e.key === "Escape" && openNavGroup){
    e.preventDefault();
    const key = openNavGroup;
    suppressNavFocusOpen = true;
    closeNavMenus();
    const target = document.querySelector(`[data-nav-group="${key}"]`);
    if(target) target.focus();
    setTimeout(()=>{ suppressNavFocusOpen = false; }, 0);
    return;
  }
  if(trigger && e.key === "ArrowDown"){
    e.preventDefault();
    const key = trigger.dataset.navGroup;
    pinnedNavGroup = key;
    setNavOpen(key, true);
    const first = item?.querySelector(".nav-dropdown-item");
    if(first) first.focus();
    return;
  }
  const current = e.target.closest(".nav-dropdown-item");
  if(!current || !item || !["ArrowDown","ArrowUp","Home","End"].includes(e.key)) return;
  e.preventDefault();
  const items = Array.from(item.querySelectorAll(".nav-dropdown-item"));
  let index = items.indexOf(current);
  if(e.key === "Home") index = 0;
  else if(e.key === "End") index = items.length - 1;
  else if(e.key === "ArrowDown") index = (index + 1) % items.length;
  else index = (index - 1 + items.length) % items.length;
  items[index]?.focus();
}
function onDocumentNavClick(e){
  const primary = document.getElementById("primaryNav");
  if(openNavGroup && !primary.contains(e.target)) closeNavMenus();
}
function onMainClick(e){
  const orgRow = e.target.closest("[data-org-id]");

/* 月表示→週表示に切り替えるときの週開始日（月曜）。表示中の月に今日が含まれれば今日を含む週、
   そうでなければその月の1日を含む週。週の起点は monthGridWeeks と同じ月曜始まり（mondayOf）。 */
function weekStartForCurrentMonth(){
  if(!eventCalMonth){ const t=new Date(); eventCalMonth={y:t.getFullYear(), mo:t.getMonth()+1}; }
  const t = new Date(); t.setHours(0,0,0,0);
  const {y, mo} = eventCalMonth;
  const inMonth = (t.getFullYear() === y && (t.getMonth()+1) === mo);
  return mondayOf(inMonth ? t : new Date(y, mo-1, 1));
}
/* イベントカレンダーが週表示のとき、表示中の週に今日が含まれていれば横スクロール領域
   （.event-calendar-desktop、モバイルでは overflow-x:auto）を今日の列が左端に来る位置まで
   動かす。月表示のとき・今日がその週に無いとき（calCellClassが.todayを付けない）は何もしない。
   #eventCalendarの innerHTML を差し替える3箇所（初回描画・月週切替・前後移動）から毎回呼ぶ。 */
function scrollEventWeekToToday(){
  if(eventCalView !== "week") return;
  const calEl = document.getElementById("eventCalendar");
  const scrollHost = calEl && calEl.querySelector(".event-calendar-desktop");
  const todayCell = scrollHost && scrollHost.querySelector(".cal-cell.today");
  if(!scrollHost || !todayCell) return;
  const hostRect = scrollHost.getBoundingClientRect();
  const cellRect = todayCell.getBoundingClientRect();
  scrollHost.scrollLeft += cellRect.left - hostRect.left;
}
/* イベントカレンダーの月／週表示の切替。#eventCalendar のみ再描画する（月送りと同じ方式）。 */
function switchEventCalView(view){
  if((view !== "month" && view !== "week") || view === eventCalView) return;
  if(view === "week"){
    eventCalWeekStart = weekStartForCurrentMonth();          // 表示中の月に合わせた週へ
  } else if(eventCalWeekStart){
    eventCalMonth = {y: eventCalWeekStart.getFullYear(), mo: eventCalWeekStart.getMonth()+1}; // 週開始日を含む月へ
  }
  eventCalView = view;
  const calEl = document.getElementById("eventCalendar");
  if(calEl){
    calEl.innerHTML = eventCalendarInnerHTML(ND.events);
    scrollEventWeekToToday();
    const activeBtn = calEl.querySelector(`[data-cal-view="${view}"]`);
    if(activeBtn) try{ activeBtn.focus({preventScroll:true}); }catch(e){ activeBtn.focus(); }
  }
}
/* カレンダー（イベント／キャンペーン共通）の移動。イベントは週表示中なら±7日の週送り、
   それ以外は月送り。対象カレンダーのコンテナのみ再描画する */
function navigateCalendar(target, delta){
  if(target === "event"){
    if(eventCalView === "week"){
      if(!eventCalWeekStart){ eventCalWeekStart = weekStartForCurrentMonth(); }
      const ws = new Date(eventCalWeekStart);
      ws.setDate(ws.getDate() + delta*7);
      eventCalWeekStart = ws;
    } else {
      if(!eventCalMonth){ const t=new Date(); eventCalMonth={y:t.getFullYear(), mo:t.getMonth()+1}; }
      eventCalMonth.mo += delta;
      if(eventCalMonth.mo < 1){ eventCalMonth.mo = 12; eventCalMonth.y--; }
      if(eventCalMonth.mo > 12){ eventCalMonth.mo = 1; eventCalMonth.y++; }
    }
    const calEl = document.getElementById("eventCalendar");
    if(calEl){
      calEl.innerHTML = eventCalendarInnerHTML(ND.events);
      scrollEventWeekToToday();
      const nextNav = calEl.querySelector(`[data-cal-nav="${delta < 0 ? -1 : 1}"]`);
      if(nextNav) try{ nextNav.focus({preventScroll:true}); }catch(e){ nextNav.focus(); }
    }
  } else {
    if(!campaignCalMonth){ campaignCalMonth = pickInitialCampaignMonth(ND.campaigns); }
    campaignCalMonth.mo += delta;
    if(campaignCalMonth.mo < 1){ campaignCalMonth.mo = 12; campaignCalMonth.y--; }
    if(campaignCalMonth.mo > 12){ campaignCalMonth.mo = 1; campaignCalMonth.y++; }
    const calEl = document.getElementById("campaignCalendar");
    if(calEl){
      calEl.innerHTML = campaignCalendarInnerHTML(ND.campaigns);
      const nextNav = calEl.querySelector(`[data-cal-nav="${delta < 0 ? -1 : 1}"]`);
      if(nextNav) try{ nextNav.focus({preventScroll:true}); }catch(e){ nextNav.focus(); }
    }
  }
}
function onMainKeydown(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  /* 行内のSNSリンクや通常のボタンは、それぞれの既定操作を優先する。 */
  if(e.target.closest("a,button,input,select,textarea")) return;
  const orgRow = e.target.closest("[data-org-id]");
  if(orgRow){ e.preventDefault(); location.hash = "#org=" + encodeURIComponent(orgRow.dataset.orgId); return; }
  const openBtn = e.target.closest("[data-open-detail]");
  if(openBtn){
    e.preventDefault();
    const entry = itemRegistry[openBtn.dataset.openDetail];
    if(entry) openDetailModal(entry.item, entry.kind);
    return;
  }
  const moreBtn = e.target.closest("[data-day-more]");
  if(moreBtn){
    e.preventDefault();
    const key = moreBtn.dataset.dayMore;
    openDayEventsModal(key, dayEventsRegistry[key] || []);
    return;
  }
}

/* ===== 詳細モーダル（イベント／キャンペーン共用。ハーネス制約によりalert/confirm/promptは使わずDOM要素で自作） ===== */
function registerItem(it, kind){
  const prefix = kind === "event" ? "evc"
    : kind === "experience" ? "exp"
    : kind === "news" ? "news"
    : kind === "udon" ? "ud"
    : kind === "sweets" ? "sweet"
    : kind === "parking" ? "pk"
    : kind === "shop" ? "shop"
    : "camp";
  const slug = contentSlug(prefix, it);
  itemRegistry[slug] = {item: it, kind};
  return slug;
}
function statusBadgeClass(status){
  if(status === "実施中" || status === "開催中" || status === "本日開催") return "status-active";
  if(status === "終了") return "status-ended";
  return "status-upcoming";
}
function modalContentHTML(it, kind){
  if(kind === "experience") return experienceModalHTML(it);
  if(kind === "news") return newsModalHTML(it);
  if(kind === "udon") return udonModalHTML(it);
  if(kind === "sweets") return coolSweetModalHTML(it);
  if(kind === "parking") return parkingModalHTML(it);
  if(kind === "shop") return shopModalHTML(it);
  const placeParts = [];
  if(it.city && it.city !== "琴平町") placeParts.push(it.city);
  if(it.place) placeParts.push(it.place);
  function row(label, val){
    return `<div class="modal-row"><span class="mr-label">${esc(label)}</span><span>${esc(val)}</span></div>`;
  }
  const isEvent = kind === "event";
  const rows = [row(isEvent ? "開催日時" : "🗓 日時", fmtEventDate(it.start, it.end))];
  if(placeParts.length) rows.push(row(isEvent ? "開催場所" : "📍 場所", placeParts.join(" / ")));
  if(it.address) rows.push(row(isEvent ? "住所" : "🏠 住所", it.address));
  if(it.fee) rows.push(row(isEvent ? "参加費" : "💰 参加費", isEvent ? formatEventFee(it.fee) : it.fee));
  if(it.organizer) rows.push(row(isEvent ? "主催" : "🏢 主催", it.organizer));
  // ステータスはカード（クリック前）と一致させる：イベントは開催日から毎回計算した値を使う
  const statusText = isEvent ? eventDateStatus(it) : it.status;
  const href = safeUrl(it.url);
  const imgSrc = safeUrl(it.image);
  return `
    ${imgSrc ? `<img class="modal-img" src="${esc(imgSrc)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : ""}
    <h3 class="modal-title" id="modalTitle">${esc(it.title)}</h3>
    ${statusText ? `<span class="modal-badge ${statusBadgeClass(statusText)}">${esc(statusText)}</span>` : ""}
    ${rows.join("")}
    ${it.comment ? `<div class="modal-comment">${esc(it.comment)}</div>` : ""}
    ${href ? `<a class="modal-link" href="${esc(href)}" target="_blank" rel="noopener">ホームページを開く ↗</a>` : ""}`;
}
function openDetailModal(item, kind){
  const overlay = document.getElementById("modalOverlay");
  if(!overlay.classList.contains("show")) modalLastFocusedEl = document.activeElement;
  document.getElementById("modalBody").innerHTML = modalContentHTML(item, kind);
  showDetailModal();

function showDetailModal(){
  const overlay = document.getElementById("modalOverlay");
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden", "false");
  document.getElementById("modalCloseBtn").focus();
  const frame = document.getElementById("appFrame");
  frame.setAttribute("inert", "");
  frame.setAttribute("aria-hidden", "true");
}
function closeDetailModal(){
  const overlay = document.getElementById("modalOverlay");
  const frame = document.getElementById("appFrame");
  frame.removeAttribute("inert");
  frame.removeAttribute("aria-hidden");
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden", "true");

    modalLastFocusedEl.focus();
  }
  modalLastFocusedEl = null;
}

/* イベントカレンダーのセル内「+N件」クリック時：その日のイベント一覧を同じモーダルで表示 */
function openDayEventsModal(dateKey, items){
  modalLastFocusedEl = document.activeElement;
  const parts = (dateKey||"").split("-").map(Number);
  const y = parts[0], mo = parts[1], d = parts[2];
  const wdLabel = (y && mo && d) ? `${mo}/${d}（${WEEKDAYS[new Date(y,mo-1,d).getDay()]}）` : "";
  const rows = items.map(it=>{
    const slug = registerItem(it, "event");
    const s = parseDT(it.start);
    const timeStr = (s && s.h!==null) ? `${pad2(s.h)}:${pad2(s.mi)}` : "―";
    return `<div class="compact-row" data-open-detail="${esc(slug)}" tabindex="0" role="button" aria-haspopup="dialog">
      <span class="cr-date">${esc(timeStr)}</span><span class="cr-title">${esc(it.title)}</span>
    </div>`;
  }).join("");
  document.getElementById("modalBody").innerHTML = `
    <h3 class="modal-title" id="modalTitle">${esc(wdLabel)}のイベント</h3>
    <div class="compact-list">${rows}</div>`;
  showDetailModal();
}

/* ===== 🏠 ホーム（ダイジェスト。カードは各タブと同じ部品・同じサイズで統一。
   3セクションはテーマ色＋説明文で区別する） ===== */
function homeSection(cls, title, sub, route, bodyHtml){

    ${bodyHtml}

/* ホームのニュース/イベント/キャンペーンで共用する横スクロールカルーセルの外枠。
   矢印は≤720pxのみCSSで表示し、端到達での無効化・クリック時のスクロールはbindCarouselArrows()が配線する。
   中身が空(emptyMsg)の場合はカルーセル化する意味が無いので、呼び出し側でカード有りの時だけ使う。 */
function carouselHTML(cardGridHtml){
  return `<div class="carousel">
    <button type="button" class="carousel-arrow prev" aria-label="前のカードへ">◀</button>
    ${cardGridHtml}
    <button type="button" class="carousel-arrow next" aria-label="次のカードへ">▶</button>
  </div>`;
}
function homeHTML(){
  let newsBody;
  const newsVisible = ND.news.filter(newsIsVisible);
  if(newsVisible.length){
    /* PC(>720px)は先頭3件だけを見せる（CSSで4件目以降を隠す）。
       モバイルは横スクロールカルーセルで6件まで見せるため、ここでは6件描画しておく */
    const topPicks = newsVisible.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,6);
    newsBody = carouselHTML(`<div class="card-grid">${topPicks.map(newsBox).join("")}</div>`);
  } else {
    newsBody = emptyMsg(ND.news.length ? "表示対象のニュースがありません。" : NOTION_EMPTY_MSG);
  }

  let eventsBody;
  if(ND.events.length){
    // イベントタブと同じく開催日から毎回計算して選ぶ（statusは取得時点で固定のため使わない）
    const active = ND.events.filter(i=>{ const st = eventDateStatus(i); return st === "本日開催" || st === "開催中"; });
    const upcoming = ND.events.filter(i=>eventDateStatus(i)==="開催予定").sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    const picks = active.concat(upcoming).slice(0,3);
    eventsBody = picks.length
      ? carouselHTML(`<div class="card-grid">${picks.map(it=>itemCard(it,"event")).join("")}</div>`)
      : emptyMsg("現在、開催中・予定のイベントはありません。");
  } else {
    eventsBody = emptyMsg(NOTION_EMPTY_MSG);
  }

  let campsBody;
  if(ND.campaigns.length){
    const active = ND.campaigns.filter(i=>i.status==="実施中");
    campsBody = active.length
      ? carouselHTML(`<div class="card-grid">${active.slice(0,3).map(it=>itemCard(it,"campaign",{badge:"実施中"})).join("")}</div>`)
      : emptyMsg("現在実施中のキャンペーンはありません。");
  } else {
    campsBody = emptyMsg(NOTION_EMPTY_MSG);
  }

  /* 並び順：最新ニュース→直近のイベント→実施中のキャンペーン→いま営業中のうどん店（PC・モバイル共通） */
  return homeSection("hs-news", "📰 最新ニュース", "町に関する報道・記事", "news", newsBody)
    + homeSection("hs-events", "📅 直近のイベント", "今日・これからの催し", "events", eventsBody)
    + homeSection("hs-camps", "🎁 実施中のキャンペーン", "いま使えるお得情報", "campaigns", campsBody)
    + homeUdonOpenHTML();
}
/* ホーム3カルーセル（ニュース/イベント/キャンペーン）共通の矢印配線。render()のたびに呼ぶが、
   カルーセルはホーム表示時にしかDOMに無いので他タブでは何もしない。
   カード幅は72vw/max280pxのCSSと二重管理しないよう実測（1枚目の.card-grid直下要素の実幅+gap）で求める。 */
function bindCarouselArrows(){
  document.querySelectorAll("#main .carousel").forEach(setUpCarousel);
}
function setUpCarousel(carousel){
  const track = carousel.querySelector(".card-grid");
  const prevBtn = carousel.querySelector(".carousel-arrow.prev");
  const nextBtn = carousel.querySelector(".carousel-arrow.next");
  if(!track || !prevBtn || !nextBtn) return;
  function cardStep(){
    const card = track.firstElementChild;
    if(!card) return track.clientWidth;
    const gap = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap || "0") || 0;
    return card.getBoundingClientRect().width + gap;
  }
  function updateEdgeState(){
    const max = track.scrollWidth - track.clientWidth;
    carousel.classList.toggle("at-start", track.scrollLeft <= 2);
    carousel.classList.toggle("at-end", track.scrollLeft >= max - 2);
  }
  prevBtn.addEventListener("click", ()=> track.scrollBy({left:-cardStep(), behavior:"smooth"}));
  nextBtn.addEventListener("click", ()=> track.scrollBy({left:cardStep(), behavior:"smooth"}));
  track.addEventListener("scroll", updateEdgeState, {passive:true});
  updateEdgeState();
}
/* ホーム：いま営業中のうどん店モジュール。schedule を持つ店が1件も無ければ（データ未着時）何も出さない。
   ニュースの直後に置き、主要3セクションより控えめな装いにする。判定は改修Bと同じ営業時間の目安。 */
function homeUdonOpenHTML(){
  const items = (UDON.items || []).filter(x => x.show !== false && x.schedule);
  if(!items.length) return "";
  const np = jstNowParts();
  const nowLabel = minToHHMM(np.minutes);

  const open = [];
  const preList = [];
  items.forEach(it=>{
    const st = udonOpenStatus(it.schedule, np);
    if(!st) return;
    if(st.key === "open"){ open.push(it); }
    else if(st.key === "pre"){
      const openMin = udonNextOpenMinutes(it.schedule, np);
      if(openMin != null) preList.push({it, openMin});
    }
  });

  const listHtml = open.length
    ? `<div class="home-udon-list">${open.map(it=>homeUdonRow(it, np)).join("")}</div>`
    : `<div class="home-udon-empty">いま営業時間内の店はありません。</div>`;

  let preHtml = "";
  if(preList.length){
    preList.sort((a,b)=>a.openMin - b.openMin);
    const picks = preList.slice(0,2).map(p=>`${esc(p.it.name)} ${minToHHMM(p.openMin)}〜`);
    preHtml = `<div class="home-udon-pre">このあと開店: ${picks.join(" ／ ")}</div>`;
  }

  return `<section class="home-udon" aria-labelledby="homeUdonTitle">
    <div class="home-udon-head">
      <h2 class="group-h" id="homeUdonTitle">🍜 いま営業中のうどん店</h2>
      <span class="home-udon-time">${esc(nowLabel)}時点</span>
    </div>
    ${listHtml}
    ${preHtml}
    <div class="home-udon-foot"><button type="button" class="quick-route home-udon-more" data-route="udon">営業状況を確認できない店もあります → うどん店一覧へ</button></div>
    <p class="hint" style="margin:8px 0 0">営業中の表示は確認日時点の営業時間による目安です（臨時休業・売り切れ終了あり）。</p>
  </section>`;
}
