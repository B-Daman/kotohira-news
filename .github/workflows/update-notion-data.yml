# Notionの3DB（ニュース・イベント・キャンペーン）を毎時取得して notion-data.js を更新し、
# 差分があればコミット→push→Cloudflare Pages に自動反映するワークフロー。
# 必要なSecret: KOTOHIRA_DASHBOARD_NOTION_TOKEN（読み取り専用トークン。scripts/README.md 参照）
name: Update Notion data

on:
  schedule:
    # JST 6:30〜翌0:30 の毎時30分（= UTC 21〜23時・0〜15時）。深夜帯は止める。
    # ダム更新（毎時0分）とずらすため30分に置く。GitHubのcronは数分〜最大1時間程度遅れることがある
    - cron: "30 21-23,0-15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-notion-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # サムネイル圧縮に使う Pillow を一時環境で用意する。
      # ここが失敗しても下の fetch は Pillow 無しで動く（圧縮だけ行われない）
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        continue-on-error: true

      - name: Fetch Notion data
        env:
          KOTOHIRA_DASHBOARD_NOTION_TOKEN: ${{ secrets.KOTOHIRA_DASHBOARD_NOTION_TOKEN }}
        run: |
          if [ -z "$KOTOHIRA_DASHBOARD_NOTION_TOKEN" ]; then
            echo "::error::Secret KOTOHIRA_DASHBOARD_NOTION_TOKEN が未設定です。リポジトリの Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi
          if command -v uv >/dev/null 2>&1; then
            uv run --with Pillow --python 3.12 scripts/fetch_notion.py
          else
            echo "::warning::uv が使えないため、画像を圧縮せずに実行します。"
            python scripts/fetch_notion.py
          fi

      - name: Validate output
        # 3キーとも空でないことを確認してから公開する（空なら中止。fetch側にも失敗時の既存データ温存あり）
        run: |
          node -e '
            const fs = require("fs");
            const w = {};
            (new Function("window", fs.readFileSync("notion-data.js", "utf8")))(w);
            const d = w.NOTION_DATA || {};
            for (const k of ["news", "events", "campaigns"]) {
              if (!Array.isArray(d[k]) || d[k].length === 0) {
                console.error("validation failed: " + k + " is empty");
                process.exit(1);
              }
              console.log(k + ": " + d[k].length + " items");
            }'

      - name: Audit duplicate events (once a day, from 09:00 JST)
        # イベントDBの同日類似を1日1回監査する（docs/重複防止_設計.md 5章）。
        # JST 9 時以降で、出力JSONの generated_date が今日（JST）でないときに実行する。
        # cron が遅れても当日の最初の回で動く。手動実行（workflow_dispatch）は常に実行。
        # 読み取りのみ。失敗しても更新全体は止めない
        continue-on-error: true
        env:
          KOTOHIRA_DASHBOARD_NOTION_TOKEN: ${{ secrets.KOTOHIRA_DASHBOARD_NOTION_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(TZ=Asia/Tokyo date +%H)
          today=$(TZ=Asia/Tokyo date +%F)
          last=$(python -c "import json;print(json.load(open('docs/data/duplicate-candidates.json',encoding='utf-8')).get('generated_date',''))" 2>/dev/null || true)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$((10#$hour))" -ge 9 ] && [ "$last" != "$today" ]; }; then
            python scripts/audit_duplicates.py
          else
            echo "Duplicate audit already done today or before 09:00 JST; skip."
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notion-data.js assets/thumbs
          git add docs/data/duplicate-candidates.json docs/data/duplicate-candidates.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes; skip commit."
            exit 0
          fi
          git commit -m "chore: Notion data update"
          # 実行が遅れてダム更新のpushと重なった場合に備え、先に取り込んでから push する
          git pull --rebase
          git push
